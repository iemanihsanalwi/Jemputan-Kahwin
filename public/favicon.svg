<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#C5A059"/>
      <stop offset="85%" stop-color="#D8A49B"/>
      <stop offset="100%" stop-color="#86652C"/>
    </linearGradient>

    <!-- Soft Petal Rose Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#E8C5BE"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>

    <!-- Romantic Mulberry / Rose Background -->
    <radialGradient id="roseBg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#4A2E35"/>
      <stop offset="60%" stop-color="#3D2429"/>
      <stop offset="100%" stop-color="#241317"/>
    </radialGradient>

    <!-- Ambient Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxurious Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#roseBg)"/>

  <!-- Botanical Filigree Border System -->
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  <rect x="34" y="34" width="444" height="444" rx="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Botanical Circular Vine Wreath -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Left Olive Leaf Branch -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 426 C 160 426, 86 352, 86 256 C 86 166, 154 90, 246 86" fill="none"/>
    <path d="M 120 340 C 100 336, 92 356, 108 364 Z" fill="url(#petalGrad)"/>
    <path d="M 94 280 C 74 272, 70 292, 86 300 Z" fill="url(#petalGrad)"/>
    <path d="M 94 232 C 74 240, 70 220, 86 212 Z" fill="url(#petalGrad)"/>
    <path d="M 120 172 C 100 176, 96 156, 112 148 Z" fill="url(#petalGrad)"/>
    <path d="M 180 114 C 172 94, 192 90, 196 110 Z" fill="url(#petalGrad)"/>
  </g>

  <!-- Right Olive Leaf Branch -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 426 C 352 426, 426 352, 426 256 C 426 166, 358 90, 266 86" fill="none"/>
    <path d="M 392 340 C 412 336, 420 356, 404 364 Z" fill="url(#petalGrad)"/>
    <path d="M 418 280 C 438 272, 442 292, 426 300 Z" fill="url(#petalGrad)"/>
    <path d="M 418 232 C 438 240, 442 220, 426 212 Z" fill="url(#petalGrad)"/>
    <path d="M 392 172 C 412 176, 416 156, 400 148 Z" fill="url(#petalGrad)"/>
    <path d="M 332 114 C 340 94, 320 90, 316 110 Z" fill="url(#petalGrad)"/>
  </g>

  <!-- Apex Jasmine Blossom -->
  <g transform="translate(256, 86)">
    <circle cx="0" cy="0" r="4" fill="url(#goldGrad)"/>
    <path d="M 0 0 C -4 -12, 4 -12, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 0 0 C 12 -4, 12 4, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 0 0 C -12 4, -12 -4, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Base Jasmine Blossom -->
  <g transform="translate(256, 426)">
    <circle cx="0" cy="0" r="4" fill="url(#goldGrad)"/>
    <path d="M 0 0 C -4 12, 4 12, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 0 0 C 12 -4, 12 4, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 0 0 C -12 4, -12 -4, 0 0 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Interlocking Gold Rings Centerpiece -->
  <!-- Left Groom Ring -->
  <circle cx="226" cy="256" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="9" filter="url(#goldGlow)"/>
  <!-- Right Bride Ring -->
  <circle cx="286" cy="256" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="9" filter="url(#goldGlow)"/>

  <!-- Interlock Overlap -->
  <path d="M 242 208 A 56 56 0 0 1 282 256" fill="none" stroke="url(#goldGrad)" stroke-width="9"/>

  <!-- Solitaire Diamond on Bride Ring -->
  <polygon points="286,190 294,200 286,210 278,200" fill="url(#goldGrad)"/>
  <polygon points="286,192 292,200 286,208 280,200" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="286" cy="200" r="2.5" fill="#FFF7CC"/>
</svg>
